version: "3.9"
services:
  backend:
    image: amankhoja/finbuddy-backend:latest
    container_name: finbuddy-backend
    ports: ["8000:8000"]        # API exposed publicly
    restart: unless-stopped
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase_admin
    volumes:
      - ./secrets/firebase-adminsdk.json:/run/secrets/firebase_admin:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    image: amankhoja/finbuddy-frontend:latest
    container_name: finbuddy-frontend
    ports: ["80:80"]            # UI exposed publicly
    restart: unless-stopped
    depends_on: [backend]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
